name: Deploy after checks

on:
  workflow_run:
    workflows:
      - Smart Commits
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  verify-and-deploy:
    name: Verify checks and deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify commit is still current on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"

          if [ "$MAIN_SHA" != "$SHA" ]; then
            echo "Commit is no longer current on main."
            echo "Skipping deployment of $SHA."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Wait for CI result
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            RUN="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$SHA" \
              --limit 20 \
              --json headSha,status,conclusion,databaseId \
              --jq "[.[] | select(.headSha == \"$SHA\")][0] // empty")"

            if [ -n "$RUN" ]; then
              STATUS="$(jq -r '.status' <<< "$RUN")"
              CONCLUSION="$(jq -r '.conclusion // empty' <<< "$RUN")"

              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI passed for $SHA."
                  exit 0
                fi

                echo "::error::CI finished with conclusion: $CONCLUSION"
                exit 1
              fi
            fi

            echo "Waiting for CI on $SHA (attempt $attempt/60)..."
            sleep 10
          done

          echo "::error::Timed out waiting for CI on $SHA."
          exit 1

      - name: Trigger Docker build and deployment
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          gh workflow run docker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f ref="$SHA"

          echo "Docker deployment dispatched for $SHA."