name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to build"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: collegefootballrisk/cfbr

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Checkout exact commit requested by Smart Commits
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      # ============================================
      # Read frontend version
      # ============================================
      - name: Read frontend version
        id: package-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Frontend version: $VERSION"
          echo "Git branch: main"
          echo "Git commit: ${{ inputs.ref }}"

      # ============================================
      # Log in to GHCR
      # ============================================
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # Set up Docker Buildx
      # ============================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================
      # Build and push
      # ============================================
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:main
            ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.ref }}

          build-args: |
            APP_VERSION=${{ steps.package-version.outputs.version }}
            GIT_BRANCH=main
            GIT_COMMIT=${{ inputs.ref }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================
      # Deploy to Portainer
      # ============================================
      - name: Deploy to Portainer
        if: success()
        run: |
          curl --fail-with-body \
            -X POST \
            -H "X-CFBR-Deployment-Key: ${{ secrets.CFBR_DEPLOYMENT_SECRET }}" \
            "${{ secrets.CFBR_DEPLOYMENT_URL }}"