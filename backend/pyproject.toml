[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

ignore = [
    "B008"
]

[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

check_untyped_defs = true

warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "app.config.settings"
ignore_errors = true